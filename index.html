<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Spoon-Knife - A modern GitHub collaboration demo">
    <title>Spoon-Knife | Modern GitHub Collaboration</title>
    <link href="styles.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="hero-section">
            <h1 class="title">🍴 Spoon-Knife</h1>
            <p class="subtitle">Where collaboration meets innovation</p>
        </header>

        <main class="content">
            <div id="octocat" class="octocat-container">
                <img src="https://octodex.github.com/images/NUX_Octodex.gif" alt="Octocat mascot animation">
            </div>

            <div class="collaboration-section">
                <p class="main-message">
                    Ready to team up? Let's collaborate, <span class="highlight">@octocat</span>!
                </p>
                
                <div class="action-buttons">
                    <a href="https://github.com/ibnehussain/Spoon-Knife" class="btn btn-primary">
                        🚀 View Repository
                    </a>
                    <a href="https://github.com/ibnehussain/Spoon-Knife/fork" class="btn btn-secondary">
                        🍴 Fork This Project
                    </a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2025 GitHub Collaboration Demo</p>
        </footer>
    </div>
</body>
</html>
